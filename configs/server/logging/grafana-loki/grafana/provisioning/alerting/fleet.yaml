        {
          "uid": "fleet-disk-prediction",
          "title": "Disk filling quickly",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "queryType": "",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "queryType": "instant",
                "refId": "A",
                "expr": "(100 * (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) > on(host) group_left() fleet_threshold_disk_used_percent) and (node_filesystem_readonly == 0) and (deriv(node_filesystem_avail_bytes[6h]) < 0) and (node_filesystem_avail_bytes / -deriv(node_filesystem_avail_bytes[6h]) < on(host) group_left() (fleet_threshold_disk_fill_hours * 3600)) and (count_over_time(node_filesystem_avail_bytes[6h]) >= 660) and (time() - min_over_time(timestamp(node_filesystem_avail_bytes)[6h:1m]) >= 21000)",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "for": "15m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "__panelId__": "1",
            "summary": "Disk filling quickly on {{ $labels.host }}",
            "description": "Writable filesystem is over 70% used and forecast to fill within 24h, with nearly six hours of history.",
            "runbook_url": "/d/fleet-usage",
            "__dashboardUid__": "fleet-usage"
          },
          "labels": {
            "service": "host",
            "severity": "warning"
          },
          "isPaused": false
