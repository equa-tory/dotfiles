{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "fleet-monitoring",
      "folder": "Fleet monitoring",
      "interval": "1m",
      "rules": [
        {
          "uid": "fleet-high-cpu",
          "title": "High CPU",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "queryType": "",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "queryType": "instant",
                "refId": "A",
                "expr": "100 * (1 - avg by(host) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))) > on(host) fleet_threshold_cpu_percent",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "for": "15m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "__panelId__": "1",
            "summary": "High CPU on {{ $labels.host }}",
            "description": "Five-minute CPU average above the machine threshold.",
            "runbook_url": "/d/fleet-usage",
            "__dashboardUid__": "fleet-usage"
          },
          "labels": {
            "service": "host",
            "severity": "warning"
          },
          "isPaused": false
        },
        {
          "uid": "fleet-high-bandwidth",
          "title": "High outgoing bandwidth",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "queryType": "",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "queryType": "instant",
                "refId": "A",
                "expr": "sum by(host) (rate(node_network_transmit_bytes_total[5m])) * 8 / 1e6 > on(host) fleet_threshold_outgoing_mbps",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "for": "15m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "__panelId__": "1",
            "summary": "High outgoing bandwidth on {{ $labels.host }}",
            "description": "Suspicious outgoing traffic indicator; does not prove DDoS and does not block traffic.",
            "runbook_url": "/d/fleet-usage",
            "__dashboardUid__": "fleet-usage"
