[defaults]
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
forks = 5
[inventory]
unparsed_is_failed = True
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2
